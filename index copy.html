<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Tareas</title>
    <!-- CSS Bootstrap & Iconos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/vision.css">
    <link rel="stylesheet" href="../css/tareas.css">
</head>
<body>

    <!-- Navbar-->
    <nav class="navbar navbar-expand-lg border-bottom">
        <div class="container-fluid">
            
            <!-- Botón para abrir NOTAS en móviles -->
            <button class="btn btn-outline-secondary d-lg-none me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarNotas" aria-controls="sidebarNotas">
                <i class="bi bi-journal-text"></i> Notas
            </button>

            <a class="navbar-brand d-flex align-items-center me-auto" href="Index.html">
                <i class="bi bi-journal-richtext fs-3"></i>
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavDropdown" aria-controls="navbarNavDropdown" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse justify-content-end" id="navbarNavDropdown">
                <ul class="navbar-nav gap-2 mt-2 mt-lg-0">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-person-circle"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#"><i class="bi bi-cart3"></i></a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" id="modo" href="#"><i class="bi bi-moon-stars-fill" id="icono"></i></a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="d-flex" style="min-height: calc(100vh - 56px);">

        <!-- Sidebar Notas Extras -->
        <div class="notasExtra offcanvas-lg offcanvas-start border-end p-3" tabindex="-1" id="sidebarNotas" aria-labelledby="sidebarNotasLabel" style="width: 280px;">
            <div class="offcanvas-header border-bottom mb-2 pb-3">
                <h5 class="offcanvas-title fs-5 fw-semibold" id="sidebarNotasLabel">Notas Extras</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarNotas" aria-label="Close"></button>
            </div>

            <div class="offcanvas-body d-flex flex-column p-0">
                <a href="/" class="d-none d-lg-flex align-items-center justify-content-center pb-3 mb-3 link-body-emphasis text-decoration-none border-bottom">
                    <span class="fs-5 fw-semibold">Notas Extras</span>
                </a>
                <div class="list-group list-group-flush scrollarea border rounded w-100">
                    <a href="#" class="list-group-item backfondo list-group-item-action py-3 lh-sm">
                        <div class="d-flex w-100 align-items-center justify-content-between">
                            <strong class="mb-1">Nota 1</strong>
                            <small>Wed</small>
                        </div>
                        <div class="col-10 mb-1 small">Confirmar Extensión actividad para el 2026/06/08</div>
                    </a>
                    <a href="#" class="list-group-item backfondo list-group-item-action py-3 lh-sm">
                        <div class="d-flex w-100 align-items-center justify-content-between">
                            <strong class="mb-1">Nota 2</strong>
                            <small>Tues</small>
                        </div>
                        <div class="col-10 mb-1 small">Contenido de la nota...</div>
                    </a>
                    <a href="#" class="list-group-item backfondo list-group-item-action py-3 lh-sm">
                        <div class="d-flex w-100 align-items-center justify-content-between">
                            <strong class="mb-1">Nota 3</strong>
                            <small>Mon</small>
                        </div>
                        <div class="col-10 mb-1 small">Contenido de la nota...</div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Sección Tareas -->
        <div class="flex-grow-1 p-3 p-md-4">
            <div class="row g-4">
                <div class="col-12 col-md-12">
                    <!-- Contenedor con la clase .tareas que detecta tu JS -->
                    <div class="d-flex flex-column gap-3 py-3 ps-4 pe-3 border rounded tareas">
                        
                        <div class="d-flex flex-wrap gap-2 w-100 mt-4 ps-8">
                            <button id="btnNuevaTarea" class="btn btn-secondary">Agregar Tarea</button>
                            <vr></vr>
                            <span class="Rojo badge d-flex flex-fill justify-content-center align-items-center p-1 pe-2 text-danger-emphasis bg-danger-subtle border border-danger-subtle rounded-pill">
                                <img class="rounded-circle me-1" width="24" height="24" src="https://media.istockphoto.com/id/2217195981/vector/human-silhouette-profile.webp?a=1&b=1&s=612x612&w=0&k=20&c=wUSqGblDH8gOge5ipaBt1TjM0HLCsXHWzp-qzt_V4os=" alt="">
                                Alta
                            </span>
                            <span class="Amarillo badge d-flex flex-fill justify-content-center align-items-center p-1 pe-2 text-warning-emphasis bg-warning-subtle border border-warning-subtle rounded-pill">
                                <img class="rounded-circle me-1" width="24" height="24" src="https://media.istockphoto.com/id/2217195981/vector/human-silhouette-profile.webp?a=1&b=1&s=612x612&w=0&k=20&c=wUSqGblDH8gOge5ipaBt1TjM0HLCsXHWzp-qzt_V4os=" alt="">
                                Media
                            </span>
                            <span class="Verde badge d-flex flex-fill justify-content-center align-items-center p-1 pe-2 text-success-emphasis bg-success-subtle border border-success-subtle rounded-pill">
                                <img class="rounded-circle me-1" width="24" height="24" src="https://media.istockphoto.com/id/2217195981/vector/human-silhouette-profile.webp?a=1&b=1&s=612x612&w=0&k=20&c=wUSqGblDH8gOge5ipaBt1TjM0HLCsXHWzp-qzt_V4os=" alt="">
                                Baja
                            </span>
                        </div>
                        <hr>

                        <!-- Las tareas dinámicas creadas desde tu JS se agregarán automáticamente aquí abajo -->

                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Scripts CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- Scripts Propios -->
    <script src="../js/visual.js"></script>
    <script src="../js/alerta.js"></script>
    <script src="../js/tareas.js"></script>
    <script src="../js/taskManager.js"></script>
    <script src="../js/index.js"></script>
</body>
</html>
